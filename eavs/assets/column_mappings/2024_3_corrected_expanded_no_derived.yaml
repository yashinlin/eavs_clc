# -----------------------------------------------------------------------------
# PURPOSE OF THIS FILE
#
# This schema maps the 2024 EAVS survey structure to the longitudinal
# variable structure originally developed from the 2022.yaml mapping and the
# CLC/Lata analysis variable set.
#
# IMPORTANT:
# - The original CLC variable list was a narrower analytical subset.
# - The 2022.yaml schema expanded beyond that subset to include additional
#   related EAVS variables, especially in Section C (mail voting), including:
#     - drop box variables (C3–C6)
#     - curing variables (C7)
#     - additional mail rejection categories (C9h–C9p)
#     - comment and "other text" fields
#
# Therefore, this file preserves:
#   (1) the core longitudinal CLC variables,
#   (2) additional related EAVS variables retained from 2022.yaml,
#   (3) corrected 2024 survey-question mappings.
#
# This file contains raw variable mappings only. Calculated indicators and
# dashboard rates are handled outside this YAML file.
#
# NOTE:
# Section A changed substantially in the 2024 EAVS instrument:
# - rejected registrations moved from A7* -> A8*
# - confirmation notices moved from A8* -> A10*
# - removals moved from A9* -> A12*
# - intra/inter-jurisdiction updates were collapsed into A3e
# -----------------------------------------------------------------------------

# version: '1.1'
# year: 2026
# notes:
# - 'Corrected 2024 EAVS mapping for the CLC-tracked variables and formulas. Section A was restructured in 2024: rejected registration
#   transactions are A3f/A8*, confirmation notices are A10*, and voter removals are A12*.

# - Expanded from 2024_corrected.yaml by adding valid related 2024 fields present in 2024.yaml but absent from the CLC-focused
#   subset, especially mail ballot drop box, curing, comment/text, and additional C9 rejection categories.
# - Does not include separate 2022-style intrajurisdiction_registration_updates and interjurisdiction_registration_updates fields
#   because the 2024 survey combines these concepts into A3e (registration_updates).
# - Does not include voters_removed_total_2020_2022 because the corresponding 2024 concept is voters_removed_total mapped to
#   A12a.
# - Derived/formula variables are intentionally excluded from this mapping file; dashboard rates are calculated outside the
#   YAML.

